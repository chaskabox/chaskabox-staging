.dynamic-pd{max-width:1100px;margin:0 auto;padding:18px 14px 60px}.dynamic-pd .crumb{margin:8px 0 16px;color:var(--muted);font-size:13px}.dynamic-pd .crumb a{color:var(--navy)}
.dynamic-pd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:34px;align-items:start}.dynamic-pd-img{min-height:420px;border:1px solid var(--border);border-radius:22px;background:var(--card);display:grid;place-items:center;overflow:hidden}.dynamic-pd-img img{width:100%;height:100%;max-height:560px;object-fit:contain}.dynamic-pd-info h1{font-size:clamp(28px,4vw,48px);line-height:1.05;margin:8px 0}.dynamic-pd-info .price{font-size:28px}.dynamic-actions{display:flex;gap:10px;align-items:center;margin:20px 0}.dynamic-actions input{width:76px;padding:13px;border:1px solid var(--border);border-radius:10px}.dynamic-actions .cta{flex:1;border:0;cursor:pointer}.dynamic-meta{display:grid;gap:8px;margin:18px 0}.dynamic-meta span{padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--card)}.dynamic-related{margin-top:36px}.dynamic-related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.dynamic-related-grid a{text-decoration:none;color:inherit}.dynamic-related-grid .card{height:100%}.dynamic-loading{padding:80px 16px;text-align:center}.dynamic-error{padding:60px 20px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:18px}.noimg.dynamic{min-height:420px;width:100%;display:grid;place-items:center;text-align:center}
@media(max-width:760px){.dynamic-pd-grid{grid-template-columns:1fr;gap:18px}.dynamic-pd-img,.noimg.dynamic{min-height:300px}.dynamic-actions{position:sticky;bottom:8px;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:10px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
