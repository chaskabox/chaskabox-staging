<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Track Order — ChaskaBox</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#201a17;background:#fffaf5;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:32px 0 64px}.brand{font-weight:900;font-size:1.25rem;letter-spacing:-.02em}.card{background:#fff;border:1px solid #eadfd6;border-radius:22px;padding:22px;box-shadow:0 12px 36px rgba(54,35,22,.08);margin-top:20px}h1{font-size:clamp(1.8rem,7vw,3rem);line-height:1;margin:.35em 0 .3em}p{line-height:1.55;color:#675a52}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}input{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid #cfc1b8;background:white;outline:none}input:focus{border-color:#9a4f1d;box-shadow:0 0 0 3px rgba(154,79,29,.12)}button{appearance:none;border:0;border-radius:13px;padding:13px 18px;background:#8f4318;color:white;font:inherit;font-weight:800;cursor:pointer;min-height:48px}button:disabled{opacity:.65;cursor:wait}.actions{display:flex;align-items:end}.msg{min-height:24px;margin-top:14px;font-weight:650}.error{color:#a32424}.success{color:#276b3b}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.pill{padding:12px 13px;background:#fff7ef;border:1px solid #f0dfd0;border-radius:14px}.pill b{display:block;font-size:.78rem;color:#78675d;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.timeline{list-style:none;padding:0;margin:18px 0}.timeline li{position:relative;padding:0 0 18px 30px}.timeline li:before{content:"";position:absolute;left:5px;top:5px;width:11px;height:11px;border-radius:99px;background:#8f4318}.timeline li:after{content:"";position:absolute;left:10px;top:17px;bottom:0;width:1px;background:#dfcaba}.timeline li:last-child:after{display:none}.timeline small{display:block;color:#76665d;margin-top:3px}.items{width:100%;border-collapse:collapse}.items th,.items td{text-align:left;padding:10px 6px;border-bottom:1px solid #eee2d9}.items th{font-size:.78rem;text-transform:uppercase;color:#76665d}.total{text-align:right;font-weight:900;font-size:1.15rem;margin-top:14px}@media(max-width:620px){.grid,.summary{grid-template-columns:1fr}.actions button{width:100%}.card{padding:18px}.wrap{width:min(100% - 22px,760px)}}@media(prefers-reduced-motion:no-preference){button{transition:transform .15s ease,filter .15s ease}button:hover{filter:brightness(1.05)}button:active{transform:translateY(1px)}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="brand">ChaskaBox</div>
  <h1>Track your order</h1>
  <p>Enter the order number from your confirmation and the same phone number used at checkout.</p>
  <section class="card" aria-labelledby="track-title">
    <form id="track-form" class="grid" novalidate>
      <div><label for="order">Order number</label><input id="order" name="order" autocomplete="off" placeholder="CB-071026-12345" required></div>
      <div><label for="phone">Phone number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="03xx xxxxxxx" required></div>
      <div class="actions"><button id="submit" type="submit">Track order</button></div>
    </form>
    <div id="message" class="msg" role="status" aria-live="polite"></div>
  </section>
  <section id="result" class="card hidden" aria-live="polite">
    <h2 id="result-title" style="margin-top:0"></h2>
    <div id="summary" class="summary"></div>
    <h3>Progress</h3><ol id="timeline" class="timeline"></ol>
    <h3>Items</h3><table class="items"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody id="items"></tbody></table>
    <div id="total" class="total"></div>
  </section>
</main>
<script>
const f=document.querySelector('#track-form'),msg=document.querySelector('#message'),res=document.querySelector('#result'),btn=document.querySelector('#submit');
const money=n=>'Rs.'+Number(n||0).toLocaleString('en-PK');
const nice=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const date=s=>{try{return new Intl.DateTimeFormat('en-PK',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Karachi'}).format(new Date(s))}catch{return ''}};
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
function addPill(root,label,value){const d=el('div',undefined,'pill');d.append(el('b',label),document.createTextNode(value));root.append(d)}
function render(d){res.classList.remove('hidden');document.querySelector('#result-title').textContent=`Order ${d.order_number}`;const s=document.querySelector('#summary');s.replaceChildren();addPill(s,'Order status',nice(d.fulfilment_status));addPill(s,'Payment',nice(d.payment_status));addPill(s,'Placed',date(d.created_at));addPill(s,'City',d.city||'—');const tl=document.querySelector('#timeline');tl.replaceChildren();const events=(d.events&&d.events.length)?d.events:[{event_type:'order_created',new_status:d.fulfilment_status,created_at:d.created_at},{event_type:'payment_status',new_status:d.payment_status,created_at:d.created_at}];for(const e of events){const li=el('li');li.append(el('strong',e.event_type==='payment_status'?`Payment: ${nice(e.new_status)}`:e.event_type==='order_created'?'Order received':`Order: ${nice(e.new_status)}`),el('small',date(e.created_at)));tl.append(li)}const items=document.querySelector('#items');items.replaceChildren();for(const i of d.items||[]){const tr=document.createElement('tr');const name=el('td',`${i.product_name}${i.pack?' · '+i.pack:''}`),qty=el('td',String(i.quantity)),amt=el('td',money(i.line_total));tr.append(name,qty,amt);items.append(tr)}document.querySelector('#total').textContent=`Total ${money(d.total)}`;}
f.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';res.classList.add('hidden');btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('/api/track-order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order_number:document.querySelector('#order').value,phone:document.querySelector('#phone').value})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(r.status===404?'Order not found. Check the order number and phone number.':d?.error?.message||d?.error||'Unable to check the order right now.');render(d);msg.className='msg success';msg.textContent='Order found.';}catch(err){msg.className='msg error';msg.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Track order';}});
</script>
<script src="/site-runtime.js?v=1" defer></script></body>
</html>
