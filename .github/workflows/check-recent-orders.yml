name: Check Recent Orders Email Status
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check recent orders
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          echo "=== Last 5 orders with email status ==="
          psql "$PROD_DB_URL" -c "
          SELECT order_number, total, email_sent, email_error, email_sent_at, created_at
          FROM orders
          ORDER BY created_at DESC
          LIMIT 5;
          "
