name: Check Order Columns
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check columns
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -c "SELECT order_number, subtotal, delivery_fee, total FROM orders WHERE order_number='CB-091026-63699';"
