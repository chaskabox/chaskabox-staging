name: Temp Email Runtime Verify (read-only)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Read-only order check
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -P null='[NULL]' <<'EOF'
          \echo '=== NEW ORDERS (created_at > watermark) ==='
          SELECT order_number, subtotal, delivery_fee, total, email_sent, email_sent_at, created_at
          FROM orders
          WHERE created_at > '2026-10-09T09:57:23Z'::timestamptz
          ORDER BY created_at ASC;
          \echo '=== DUPLICATE ORDER NUMBERS (all time) ==='
          SELECT order_number, count(*) AS n
          FROM orders
          GROUP BY order_number
          HAVING count(*) > 1;
          EOF
