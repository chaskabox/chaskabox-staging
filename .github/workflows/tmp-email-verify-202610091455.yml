name: tmp-email-verify-202610091455

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
    steps:
      - name: Read-only production orders check
        run: |
          set -euo pipefail
          test -n "$PROD_URL"
          docker run -i --rm postgres:17-alpine psql "$PROD_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET TRANSACTION READ ONLY;
          \echo '=== NEW_ORDERS ==='
          SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
          FROM orders WHERE created_at > '2026-10-09T14:28:30Z' ORDER BY created_at ASC;
          \echo '=== DUPLICATES ==='
          SELECT order_number, count(*) FROM orders GROUP BY order_number HAVING count(*) > 1;
          \echo '=== TOTALS ==='
          SELECT count(*) AS total_orders, max(created_at) AS max_created_at FROM orders;
          COMMIT;
          SQL
