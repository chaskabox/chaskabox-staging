name: Check Email Error
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check email error
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -c "SELECT order_number, email_sent, email_error FROM orders WHERE order_number IN ('CB-091026-85646', 'CB-091026-63699');"
