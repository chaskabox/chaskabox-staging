# TEMPORARY verification workflow — email-runtime-verification cron.
# Read-only SELECTs against production; deleted after use (SAFE CLEANUP).
name: email-verify-tmp
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Query new production orders since watermark
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          echo '=== new orders (created_at > 2026-10-09T10:26:58Z) ==='
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -A -F'|' -c "
            SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
            FROM orders
            WHERE created_at > '2026-10-09T10:26:58Z'
            ORDER BY created_at ASC;
          "
          echo '=== duplicate order_number check (all-time) ==='
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -A -F'|' -c "
            SELECT order_number, COUNT(*) AS n
            FROM orders
            GROUP BY order_number
            HAVING COUNT(*) > 1;
          "
          echo '=== watermark baseline (max created_at all-time) ==='
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -A -F'|' -c "
            SELECT MAX(created_at) AS max_created_at, COUNT(*) AS total_orders FROM orders;
          "
