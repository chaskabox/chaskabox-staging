name: Production DB Migration 009-019

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Clean conflicting pre-existing tables
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -c "
          DROP TABLE IF EXISTS wishlist CASCADE;
          DROP TABLE IF EXISTS addresses CASCADE;
          DROP TABLE IF EXISTS orders CASCADE;
          DROP TABLE IF EXISTS profiles CASCADE;
          "

      - name: Apply migrations 009-019 to production
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -e
          for f in \
            database/migrations/001_products.sql \
            database/migrations/002_orders.sql \
            database/migrations/003_bundles.sql \
            database/migrations/004_engagement.sql \
            database/migrations/005_admin.sql \
            database/migrations/006_rls.sql \
            database/migrations/007_seed_products.sql \
            database/migrations/008_customer_note.sql \
            database/migrations/009_notifications.sql \
            database/migrations/010_atomic_orders_customer_profiles.sql \
            database/migrations/011_distributed_rate_limit.sql \
            database/migrations/012_order_status_events.sql \
            database/migrations/013_notification_outbox.sql \
            database/migrations/014_free_ai_features.sql \
            database/migrations/015_admin_product_id_sequence.sql \
            database/migrations/016_security_settings_hardening.sql \
            database/migrations/017_customer_notification_outbox.sql \
            database/migrations/018_public_surface_hardening.sql \
            database/migrations/019_admin_cms.sql \
            database/migrations/020_fix_auth_trigger_profiles.sql ; do
            echo "=== Applying $f ==="
            psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "ALL MIGRATIONS APPLIED"

      - name: Verify key objects
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -c "SELECT count(*) AS products FROM products;" || echo "products table check done"
          psql "$PROD_DB_URL" -c "SELECT count(*) AS prod_views FROM pg_views WHERE viewname='public_products';" || true
