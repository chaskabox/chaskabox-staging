name: Diagnose Auth Issue
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check auth schema
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          echo "=== auth.users table exists? ==="
          psql "$PROD_DB_URL" -c "SELECT count(*) FROM auth.users;" 2>&1 | head -5
          echo ""
          echo "=== Check for triggers on auth.users ==="
          psql "$PROD_DB_URL" -c "SELECT trigger_name FROM information_schema.triggers WHERE event_object_schema='auth' AND event_object_table='users';" 2>&1 | head -10
