# TEMPORARY read-only verification workflow for the email-runtime-verification
# cron job. Created by the scheduled worker and REMOVED after each use
# (SAFE CLEANUP pattern). Performs only read-only SELECTs against production.
name: Temp Email Verify Check

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Read-only production order check
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          echo "=== Orders created after 2026-10-09T10:56:35Z (watermark) ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
            FROM public.orders
            WHERE created_at > '2026-10-09T10:56:35Z'
            ORDER BY created_at ASC;"
          echo "=== Duplicate order_number check (all time) ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT order_number, COUNT(*)
            FROM public.orders
            GROUP BY order_number
            HAVING COUNT(*) > 1;"
          echo "=== Max created_at ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -c "
            SELECT MAX(created_at) AS max_created_at, COUNT(*) AS total_orders
            FROM public.orders;"
