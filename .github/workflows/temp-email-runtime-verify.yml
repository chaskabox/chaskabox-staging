name: temp-email-runtime-verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only production orders check
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          echo "=== NEW ORDERS created_at > 2026-10-09T12:56:53Z ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
            FROM orders
            WHERE created_at > '2026-10-09T12:56:53Z'::timestamptz
            ORDER BY created_at ASC;"
          echo "=== DUPLICATE order_number CHECK (all-time) ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            SELECT order_number, COUNT(*) AS cnt
            FROM orders
            GROUP BY order_number
            HAVING COUNT(*) > 1;"
          echo "=== ALL-TIME COUNT + MAX created_at ==="
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            SELECT COUNT(*) AS total_orders, MAX(created_at) AS max_created_at FROM orders;"
