name: temp-email-runtime-verify (READ-ONLY)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Read-only production order check
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          BEGIN;
          SET TRANSACTION READ ONLY;
          \pset footer off
          SELECT '---NEW_ORDERS---' AS section;
          SELECT order_number, subtotal, delivery_fee, total, email_sent, payment_method, created_at
          FROM orders
          WHERE created_at > '2026-10-09T11:56:28Z'
          ORDER BY created_at ASC;
          SELECT '---DUP_CHECK---' AS section;
          SELECT order_number, COUNT(*) AS cnt
          FROM orders
          GROUP BY order_number
          HAVING COUNT(*) > 1;
          SELECT '---TOTALS---' AS section;
          SELECT COUNT(*) AS total_orders, MAX(created_at) AS max_created_at FROM orders;
          COMMIT;
          SQL
