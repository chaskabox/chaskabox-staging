name: Test Auth Trigger with QA User
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql and python3-bcrypt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client python3-pip
          pip3 install -q bcrypt
      - name: Create QA user and verify trigger
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          # Generate test user details
          TEST_EMAIL="qa-test-$(date +%s)@chaskabox.test"
          TEST_UUID=$(python3 -c "import uuid; print(uuid.uuid4())")
          # Generate bcrypt hash for password 'Test123!QA'
          BCRYPT_HASH=$(python3 -c "import bcrypt; print(bcrypt.hashpw(b'Test123!QA', bcrypt.gensalt()).decode())")
          
          echo "Test email: $TEST_EMAIL"
          echo "Test UUID: $TEST_UUID"
          # DO NOT print the hash (it's a credential)
          
          # Create user in auth.users (this will fire the trigger)
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 << SQL
          INSERT INTO auth.users (
            id, email, encrypted_password, email_confirmed_at,
            created_at, updated_at, raw_app_meta_data, raw_user_meta_data,
            is_super_admin, role
          ) VALUES (
            '$TEST_UUID',
            '$TEST_EMAIL',
            '$BCRYPT_HASH',
            now(),
            now(), now(),
            '{"provider":"email","providers":["email"]}',
            '{"name":"QA Test User"}',
            false, 'authenticated'
          );
          SQL
          
          echo ""
          echo "=== Verify profile was auto-created by trigger ==="
          psql "$PROD_DB_URL" -t -c "
          SELECT id, name, phone FROM public.profiles WHERE id = '$TEST_UUID';
          "
          
          echo ""
          echo "=== Cleanup: delete QA user and profile ==="
          # Delete from auth.users (cascade should handle profile, but be explicit)
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 << SQL
          DELETE FROM public.profiles WHERE id = '$TEST_UUID';
          DELETE FROM auth.users WHERE id = '$TEST_UUID';
          SQL
          
          echo ""
          echo "=== Verify cleanup ==="
          psql "$PROD_DB_URL" -t -c "
          SELECT count(*) as remaining FROM auth.users WHERE id = '$TEST_UUID';
          "
          echo "QA user cleanup complete"
