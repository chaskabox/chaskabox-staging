name: Check Products Without Images
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Count products without images
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -c "
          SELECT 
            count(*) as total,
            count(*) FILTER (WHERE image_url IS NULL OR image_url = '') as no_image,
            count(*) FILTER (WHERE visibility = 'visible' AND (image_url IS NULL OR image_url = '')) as visible_no_image
          FROM products;
          "
