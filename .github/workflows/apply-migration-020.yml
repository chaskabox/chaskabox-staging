name: Apply Migration 020 (Auth Trigger Fix)
on: workflow_dispatch
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migration 020
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/020_fix_auth_trigger_profiles.sql
          echo "Migration 020 applied"
          echo "=== Verify function ==="
          psql "$PROD_DB_URL" -c "SELECT pg_get_functiondef(oid) FROM pg_proc WHERE proname='handle_new_user';" | head -20
