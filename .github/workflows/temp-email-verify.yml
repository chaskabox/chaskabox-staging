name: temp-email-verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Read-only production order check
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -X <<'SQL'
          BEGIN;
          SET TRANSACTION READ ONLY;
          \echo '=== NEW_ORDERS ==='
          SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
          FROM orders
          WHERE created_at > '2026-10-09T13:26:46Z'
          ORDER BY created_at ASC;
          \echo '=== DUPLICATES ==='
          SELECT order_number, COUNT(*)
          FROM orders
          GROUP BY order_number
          HAVING COUNT(*) > 1;
          \echo '=== SUMMARY ==='
          SELECT COUNT(*) AS total_orders, MAX(created_at) AS max_created_at FROM orders;
          COMMIT;
          SQL
