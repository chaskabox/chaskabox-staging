name: temp-email-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Read-only production order check
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 <<'SQLEOF'
          BEGIN;
          SET TRANSACTION READ ONLY;
          \echo '=== NEW_ORDERS ==='
          SELECT order_number, subtotal, delivery_fee, total, email_sent, created_at
          FROM orders
          WHERE created_at > '2026-10-09T13:57:32Z'
          ORDER BY created_at ASC;
          \echo '=== DUPLICATES ==='
          SELECT order_number, COUNT(*)
          FROM orders
          GROUP BY order_number
          HAVING COUNT(*) > 1;
          \echo '=== SUMMARY ==='
          SELECT COUNT(*) AS total_orders, MAX(created_at) AS max_created_at FROM orders;
          COMMIT;
          SQLEOF
